name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            channel: win-x64
            main-exe: PromptDot.App.exe
            icon: src/PromptDot.App/Assets/Icons/promptdot-icon.ico
          - os: ubuntu-latest
            runtime: linux-x64
            channel: linux-x64
            main-exe: PromptDot.App
            icon: src/PromptDot.App/Assets/Icons/promptdot-icon-512.png
          - os: macos-latest
            runtime: osx-arm64
            channel: osx-arm64
            main-exe: PromptDot.App
            icon: src/PromptDot.App/Assets/Icons/promptdot-icon.icns
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore tools and dependencies
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore PromptDot.slnx -p:Configuration=Release
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          "value=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Test
        shell: pwsh
        run: dotnet test PromptDot.slnx --configuration Release --no-restore
      - name: Publish self-contained application
        shell: pwsh
        run: >
          dotnet publish src/PromptDot.App/PromptDot.App.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output artifacts/publish/${{ matrix.runtime }}
          -p:Version=${{ steps.version.outputs.value }}
      - name: Download previous release metadata
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          dotnet vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token $env:GH_TOKEN
          --channel ${{ matrix.channel }}
          --outputDir artifacts/velopack/${{ matrix.runtime }}
      - name: Build installer and update packages
        shell: pwsh
        run: >
          dotnet vpk pack
          --packId PromptDot
          --packVersion ${{ steps.version.outputs.value }}
          --packDir artifacts/publish/${{ matrix.runtime }}
          --mainExe ${{ matrix.main-exe }}
          --packTitle PromptDot
          --packAuthors elbruno
          --icon ${{ matrix.icon }}
          --runtime ${{ matrix.runtime }}
          --channel ${{ matrix.channel }}
          --outputDir artifacts/velopack/${{ matrix.runtime }}
      - uses: actions/upload-artifact@v6
        with:
          name: PromptDot-${{ matrix.runtime }}
          path: artifacts/velopack/${{ matrix.runtime }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find artifacts/release -maxdepth 1 -type f)
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "PromptDot $TAG" \
            --generate-notes \
            "${assets[@]}"
