name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PromptDot.slnx -p:Configuration=Release -p:Optimize=true
      - name: Build
        run: dotnet build PromptDot.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test PromptDot.slnx --no-build --configuration Release
